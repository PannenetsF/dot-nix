# Migrated from the managed Kitty configuration. Alacritty does not support
# Kitty's automatic light/dark theme files, so this uses the currently active
# Gruvbox Light palette from light-theme.auto.conf.

[general]
live_config_reload = true
ipc_socket = true

[env]
# Keep remote hosts and the shared shell TERM fallback compatible without
# requiring Alacritty's terminfo entry everywhere.
TERM = "xterm-256color"

[window]
# Keep the macOS native tab bar available while hiding the traffic-light
# buttons. Alacritty cannot reproduce Kitty's custom bottom tab bar.
decorations = "Buttonless"
opacity = 1.0

[font]
size = 16.0

[font.normal]
family = "UbuntuMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "UbuntuMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "UbuntuMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "UbuntuMono Nerd Font Mono"
style = "Bold Italic"

[scrolling]
history = 2000

[selection]
save_to_clipboard = false

[bell]
duration = 0
command = { program = "/usr/bin/osascript", args = ["-e", "display notification \"Your LONG running program is done!\" with title \"Alacritty\""] }

[colors.primary]
background = "#fbf1c7"
foreground = "#3c3836"

[colors.cursor]
cursor = "#665c54"
text = "#bdae93"

[colors.selection]
background = "#d65d0e"
text = "#3c3836"

[colors.normal]
black = "#ebdbb2"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#7c6f64"

[colors.bright]
black = "#928374"
red = "#9d0006"
green = "#79740e"
yellow = "#b57614"
blue = "#076678"
magenta = "#8f3f71"
cyan = "#427b58"
white = "#282828"

# Command+1 through Command+8 and Command+T are Alacritty macOS defaults.
# These bindings preserve Kitty's additional kitty_mod (Control+Shift) keys.
[keyboard]
bindings = [
  { key = "1", mods = "Control|Shift", action = "SelectTab1" },
  { key = "2", mods = "Control|Shift", action = "SelectTab2" },
  { key = "3", mods = "Control|Shift", action = "SelectTab3" },
  { key = "4", mods = "Control|Shift", action = "SelectTab4" },
  { key = "5", mods = "Control|Shift", action = "SelectTab5" },
  { key = "6", mods = "Control|Shift", action = "SelectTab6" },
  { key = "7", mods = "Control|Shift", action = "SelectTab7" },
  { key = "8", mods = "Control|Shift", action = "SelectTab8" },
]
