onboarding = false

[theme]
name = "terminal"
auto_switch = false
# herdr-radar (plugin, see nix-darwin/herdr.nix) follows macOS light/dark
# appearance and rewrites `name` from these keys. Pin both to "terminal" so its
# palette swap keeps the terminal-following theme instead of catppuccin.
light_name = "terminal"
dark_name = "terminal"

[ui]
# Distinct static glyphs for blocked/working/done/idle instead of color dots.
status_indicators = "symbols"

[ui.toast]
# "herdr" lets the herdr app show its own desktop toast on every platform;
# "system" asks the OS notification service directly, a backend herdr only
# ships on macOS, so it is silently dead on Linux hosts.
delivery = "herdr"

[ui.sound]
enabled = true

# Keybindings chosen to match nvim habits (see nvim/lua/vimconf/easy-keymap.lua):
# plain alt is globally owned by AeroSpace, so direct chords use ctrl+alt.
# Cheat sheet: docs/herdr-keybindings.md
[keys]
# pane focus = nvim <C-h/j/k/l> window movement
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

# swap panes = AeroSpace alt-shift+hjkl
swap_pane_left = ["prefix+shift+h", "ctrl+alt+shift+h"]
swap_pane_down = ["prefix+shift+j", "ctrl+alt+shift+j"]
swap_pane_up = ["prefix+shift+k", "ctrl+alt+shift+k"]
swap_pane_right = ["prefix+shift+l", "ctrl+alt+shift+l"]

# resize = nvim <C-arrows>
resize_pane_left = "ctrl+alt+left"
resize_pane_down = "ctrl+alt+down"
resize_pane_up = "ctrl+alt+up"
resize_pane_right = "ctrl+alt+right"

# splits: v = :vsplit, s = :split (settings moves to shift+s)
split_vertical = ["prefix+v", "ctrl+alt+v"]
split_horizontal = ["prefix+s", "ctrl+alt+s"]
settings = "prefix+shift+s"

# tabs as nvim buffers: n = <leader>bn next, b = <leader>bb prev;
# brackets mirror the ]q/[q quickfix habit
next_tab = ["prefix+n", "ctrl+alt+]"]
# NOTE: prefix+b is also herdr's built-in sidebar-collapse key (model.rs
# documents Default: "prefix+b"). Binding it here intentionally shadows that
# default, so collapsing the sidebar needs the action rebound to another key.
previous_tab = ["prefix+b", "prefix+p", "ctrl+alt+["]
new_tab = ["prefix+c", "ctrl+alt+c"]

# close pane/tab: x keeps the default prefix+[shift+]x mnemonic, direct chord added
close_pane = ["prefix+x", "ctrl+alt+x"]
close_tab = ["prefix+shift+x", "ctrl+alt+shift+x"]

# sidebar = Neotree toggle (<leader>e); scrollback editor moves to shift+e
toggle_sidebar = ["prefix+e", "ctrl+alt+e"]
edit_scrollback = "prefix+shift+e"

# goto picker = fzf / BufferLinePick (<leader>f*)
goto = ["prefix+g", "prefix+f", "ctrl+alt+f"]

# indexed jumps: tabs keep defaults, workspaces mirror AeroSpace alt-shift-1..9
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+ctrl+1..9"

zoom = ["prefix+z", "ctrl+alt+z"]

# <leader>g LazyGit -> herdr popup (lazygit comes from modules/common.nix)
[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

# Optional which-key style overlay (plugin installed out-of-band, see
# docs/herdr-keybindings.md). Guarded so the binding is a no-op popup until the
# plugin's launcher exists on a machine.
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "sh -c 'f=~/.config/herdr/plugins/config/cowboyvang.which-key/launch.sh; test -f \"$f\" && exec sh \"$f\"'"
description = "which-key: show prefix bindings"
width = "78%"
height = "62%"

# zoetrope: graph the focused agent pane's session (plugin installed by
# nix-darwin/herdr.nix; other placements: furkankly.zoetrope.open-split / open-tab)
[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "furkankly.zoetrope.open"
description = "zoetrope: session graph (overlay)"

# roadboard: 7-state roadmap task tree. Opens the plugin's registered popup
# `board` pane via its toggle action (herdr/pane.sh: open, or close when the
# board pane is focused). Plugin panes get a real TTY, unlike running the TUI
# binary directly under plugin_action; the plugin is linked by nix-darwin/herdr.nix.
[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "roadboard.open"
description = "roadboard: roadmap tree (toggle popup)"

# herdr-projects 1.2.x work board (installed by install-herdr-plugins.sh).
# prefix+a opens the board itself via the plugin's own action. Mirrors the
# nvim <leader>a namespace: a = board/agent overview, shift+C register a new
# repo, C-p switch repo, C-n new coordinator, C-f focus coordinator, shift+a
# register more repos. The repo picker scripts live in ~/.local/bin/herdr-*;
# override their scan roots with HP_PROJECT_ROOTS=~/a:~/b.
#
# The plugin also offers sidebar rows for task state, but they claim the same
# [ui.sidebar.agents] table as herdr-radar's glyphs, so they are intentionally
# NOT shipped: radar owns the sidebar, and the plugin treats radar's rows as a
# hand-written table and keeps them (the board itself shows the full rows).
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-projects.open"
description = "Projects: work board"

# Register one or more local git checkouts (fzf multi) and open the first
# repo's project coordinator.
[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "sh -c 'exec \"$HOME/.local/bin/herdr-new-project\"'"
description = "Projects: register repo and open coordinator"
width = "70%"
height = "70%"

# Pick a registered repo: focus its live coordinator pane, reopen the same
# conversation when the pane is gone, or start a fresh one on first use.
[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = "sh -c 'exec \"$HOME/.local/bin/herdr-pick-project\"'"
description = "Projects: pick repo and open coordinator"
width = "60%"
height = "60%"

# Start a FRESH project coordinator conversation for the current repo (cwd /
# underlying pane, else fzf). The plugin's pump opens the tab; unlike C-p this
# never re-enters an existing conversation. C-n = new coordinator.
[[keys.command]]
key = "prefix+ctrl+n"
type = "popup"
command = "sh -c 'exec \"$HOME/.local/bin/herdr-new-coordinator\"'"
description = "Projects: new coordinator"
width = "60%"
height = "60%"

# Focus-only jump to a repo's coordinator (state.json pane, then a live
# sw-coordinator-<repo> family member); never starts one.
[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = "sh -c 'exec \"$HOME/.local/bin/herdr-focus-coordinator\"'"
description = "Projects: focus coordinator"
width = "60%"
height = "60%"

# Register more local git checkouts in the repo registry without opening
# anything (fzf multi; already-registered checkouts are hidden).
[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "sh -c 'exec \"$HOME/.local/bin/herdr-add-repo\"'"
description = "Projects: register local repos"
width = "70%"
height = "70%"

# herdr-radar sidebar (plugin installed by nix-darwin/herdr.nix). Upstream
# suggests prefix+a for the view flip, but that is Projects' work board here,
# and plain prefix+r is herdr's resize mode, so the flip rides prefix+ctrl+r
# with the other plugin actions; settings popup on prefix+comma as upstream
# suggests. Both are no-ops until the plugin lands.
[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip"
description = "Radar: active <-> recent agent order"

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"
description = "Radar: settings popup"

# herdr-portal (plugin installed by install-herdr-plugins.sh): global board
# over every workspace/tab/pane. The TUI is the read-only fleet view (Enter
# only jumps focus to the pane and closes the overlay); the web big screen can
# also reply to an agent. Upstream suggests prefix+a, which is Projects' work
# board here, so both ride the unused o namespace.
[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "herdr-portal.open-board"
description = "Portal: global agent board (TUI popup)"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "herdr-portal.open-web"
description = "Portal: global agent board (web big screen)"
